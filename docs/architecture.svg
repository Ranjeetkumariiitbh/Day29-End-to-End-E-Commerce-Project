<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1180" height="560" fill="#f8fafc"/>
  <text x="590" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">Day 29 - End-to-End E-Commerce Data Pipeline (Apache Spark / Scala)</text>

  <!-- column headers -->
  <g font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">
    <text x="110" y="70">SOURCES</text>
    <text x="345" y="70">1. RAW (bronze)</text>
    <text x="590" y="70">2. CLEAN (silver)</text>
    <text x="835" y="70">3. ENRICH</text>
    <text x="1060" y="70">4. AGGREGATE (gold)</text>
  </g>

  <!-- sources -->
  <g font-size="12" fill="#0f172a">
    <rect x="20" y="90" width="180" height="70" rx="8" fill="#e2e8f0" stroke="#64748b"/>
    <text x="110" y="120" text-anchor="middle" font-weight="bold">orders.csv</text>
    <text x="110" y="140" text-anchor="middle">dirty, duplicates</text>
    <rect x="20" y="190" width="180" height="70" rx="8" fill="#e2e8f0" stroke="#64748b"/>
    <text x="110" y="220" text-anchor="middle" font-weight="bold">clickstream.log</text>
    <text x="110" y="240" text-anchor="middle">pipe-delimited text</text>
    <rect x="20" y="290" width="180" height="70" rx="8" fill="#e2e8f0" stroke="#64748b"/>
    <text x="110" y="320" text-anchor="middle" font-weight="bold">customers.csv</text>
    <text x="110" y="340" text-anchor="middle">reference (small)</text>
    <rect x="20" y="390" width="180" height="70" rx="8" fill="#e2e8f0" stroke="#64748b"/>
    <text x="110" y="420" text-anchor="middle" font-weight="bold">products.csv</text>
    <text x="110" y="440" text-anchor="middle">reference (small)</text>
  </g>

  <!-- RAW -->
  <g font-size="12" fill="#0f172a">
    <rect x="250" y="90" width="190" height="110" rx="8" fill="#fde68a" stroke="#b45309"/>
    <text x="345" y="115" text-anchor="middle" font-weight="bold">RawIngestion</text>
    <text x="345" y="135" text-anchor="middle">DataFrame, all-string schema</text>
    <text x="345" y="153" text-anchor="middle">+ _source_file, _ingested_at</text>
    <text x="345" y="175" text-anchor="middle" font-style="italic">output/01_raw/orders</text>
  </g>

  <!-- CLEAN -->
  <g font-size="12" fill="#0f172a">
    <rect x="490" y="90" width="200" height="130" rx="8" fill="#bbf7d0" stroke="#15803d"/>
    <text x="590" y="113" text-anchor="middle" font-weight="bold">OrderCleaner</text>
    <text x="590" y="132" text-anchor="middle">DataFrame -> Dataset[Order]</text>
    <text x="590" y="150" text-anchor="middle">type, validate, dedupe</text>
    <text x="590" y="168" text-anchor="middle">(window row_number)</text>
    <text x="590" y="190" text-anchor="middle" font-style="italic">02_clean/orders</text>
    <text x="590" y="207" text-anchor="middle" font-style="italic">02_clean/rejected_orders</text>

    <rect x="490" y="250" width="200" height="130" rx="8" fill="#a5f3fc" stroke="#0e7490"/>
    <text x="590" y="273" text-anchor="middle" font-weight="bold">ClickstreamRdd</text>
    <text x="590" y="292" text-anchor="middle">RDD / Pair RDD</text>
    <text x="590" y="310" text-anchor="middle">broadcast + accumulator</text>
    <text x="590" y="328" text-anchor="middle">reduceByKey(HashPartitioner)</text>
    <text x="590" y="350" text-anchor="middle" font-style="italic">02_clean/product_funnel</text>
  </g>

  <!-- ENRICH -->
  <g font-size="12" fill="#0f172a">
    <rect x="735" y="90" width="200" height="290" rx="8" fill="#ddd6fe" stroke="#6d28d9"/>
    <text x="835" y="115" text-anchor="middle" font-weight="bold">Enricher</text>
    <text x="835" y="140" text-anchor="middle">typed map: Order -> OrderLine</text>
    <text x="835" y="160" text-anchor="middle">UDF: order_size</text>
    <text x="835" y="185" text-anchor="middle">broadcast LEFT JOIN products</text>
    <text x="835" y="203" text-anchor="middle">broadcast LEFT JOIN customers</text>
    <text x="835" y="221" text-anchor="middle">broadcast LEFT JOIN funnel</text>
    <text x="835" y="246" text-anchor="middle">UDF: mask_email, profit</text>
    <text x="835" y="271" text-anchor="middle" font-weight="bold">persist(MEMORY_AND_DISK)</text>
    <text x="835" y="296" text-anchor="middle">repartition(order_date)</text>
    <text x="835" y="320" text-anchor="middle" font-style="italic">03_enriched/</text>
    <text x="835" y="338" text-anchor="middle" font-style="italic">partitioned by order_date</text>
  </g>

  <!-- AGGREGATE -->
  <g font-size="12" fill="#0f172a">
    <rect x="980" y="90" width="180" height="290" rx="8" fill="#fecdd3" stroke="#be123c"/>
    <text x="1070" y="115" text-anchor="middle" font-weight="bold">Aggregations</text>
    <text x="1070" y="140" text-anchor="middle">daily_revenue_by_category</text>
    <text x="1070" y="160" text-anchor="middle">daily_revenue_trend</text>
    <text x="1070" y="178" text-anchor="middle">(running + 7d moving avg)</text>
    <text x="1070" y="203" text-anchor="middle">customer_timeline (lag)</text>
    <text x="1070" y="228" text-anchor="middle">customer_summary</text>
    <text x="1070" y="246" text-anchor="middle">(UDF tier, dense_rank)</text>
    <text x="1070" y="271" text-anchor="middle">top_products_per_category</text>
    <text x="1070" y="289" text-anchor="middle">(row_number)</text>
    <text x="1070" y="314" text-anchor="middle">payment_mix</text>
    <text x="1070" y="342" text-anchor="middle" font-style="italic">04_aggregates/parquet + csv</text>
  </g>

  <!-- arrows -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="200" y1="125" x2="248" y2="125"/>
    <line x1="440" y1="145" x2="488" y2="145"/>
    <line x1="200" y1="225" x2="488" y2="300"/>
    <line x1="690" y1="155" x2="733" y2="155"/>
    <line x1="690" y1="315" x2="733" y2="260"/>
    <line x1="200" y1="325" x2="733" y2="340"/>
    <line x1="200" y1="425" x2="733" y2="360"/>
    <line x1="935" y1="235" x2="978" y2="235"/>
  </g>

  <!-- legend / notes -->
  <g font-size="12" fill="#334155">
    <rect x="250" y="410" width="910" height="125" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="268" y="434" font-weight="bold">Spark concepts on display</text>
    <text x="268" y="456">Narrow (no shuffle): select / withColumn / filter / flatMap / map / broadcast-join probe side / coalesce</text>
    <text x="268" y="476">Wide (shuffle = Exchange = new stage): window over order_id, groupBy, reduceByKey, repartition, window over customer_id</text>
    <text x="268" y="496">Actions: write / count / collect / show (each triggers a job)   |   Cached: click funnel (MEMORY_ONLY), enriched (MEMORY_AND_DISK)</text>
    <text x="268" y="516">Layers communicate through Parquet on disk, so each layer can be re-run or inspected independently.</text>
  </g>
</svg>
